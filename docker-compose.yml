services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - chroma_data:/app/rag_db
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama
    ports:
      - "11435:11434"
    volumes:
      - ollama_models:/root/.ollama

volumes:
  chroma_data:
  ollama_models: